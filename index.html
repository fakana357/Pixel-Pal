:root{--ink:#3b2a3a;--cream:#fff7ec;--pink:#ffb3cf;--mint:#a8ebc8;--sky:#a9dbff;--lemon:#ffe589;--lav:#d6c4ff;--peach:#ffcfae;--red:#ff6b7f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'LanaPixel','Unifont',ui-monospace,monospace;font-synthesis:none;-webkit-font-smoothing:none;color:var(--ink);touch-action:manipulation;background:#e9c4ad}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:520px;display:flex;flex-direction:column;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:repeating-linear-gradient(45deg,#f7dcc8 0 12px,#f3d2bc 12px 24px)}
header{padding:10px 12px 4px}
.row1{display:flex;align-items:stretch;gap:7px}
.chip{background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);position:relative}
#nameBtn{flex:1;min-width:0;text-align:left;padding:4px 8px 5px 10px;display:flex;align-items:center;gap:6px}
#nameTxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
#petName{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#petSub{font-size:16.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvBox{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:16.5px;line-height:1}
#xpBar{width:34px;height:7px;border:2px solid var(--ink);border-radius:4px;background:#fff;overflow:hidden}
#xpBar i{display:block;height:100%;width:0;background:#b48cf2;transition:width .4s}
#coins{display:flex;align-items:center;gap:5px;padding:0 8px;font-size:22px;min-height:48px}
.sq{width:46px;display:flex;align-items:center;justify-content:center;padding:0}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;pointer-events:none}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.stat{display:flex;align-items:center;gap:4px;min-width:0}
.stat .si{width:27px;height:27px;flex:none;display:flex;align-items:center;justify-content:center}
.bar{flex:1;min-width:0;height:13px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .5s}
.bar i:after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.45)}
.bar.low{animation:lowb .9s steps(2) infinite}
@keyframes lowb{50%{background:#ffc2cb}}
#stage{flex:none;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 10px}
#frame{position:relative;border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);overflow:hidden;background:#1b1530;line-height:0}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px;line-height:1;pointer-events:none;gap:6px}
#hud.hidden{display:none}
.hc{pointer-events:auto;background:rgba(255,247,236,.95);border:3px solid var(--ink);border-radius:9px;padding:4px 8px;font-size:16.5px;display:flex;align-items:center;gap:5px;min-height:34px}
.hc:empty{visibility:hidden}
#hudX{width:36px;justify-content:center;padding:0;font-size:22px}
#toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--cream);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;font-size:16.5px;line-height:1.1;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:6px;z-index:6}
#toast.show{opacity:1;transform:translate(-50%,0)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:6px 12px 14px}
.act{padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:16.5px;border:3px solid var(--ink);border-radius:13px;box-shadow:0 4px 0 var(--ink);transition:transform .05s;position:relative}
.act .ai{height:30px;display:flex;align-items:center;justify-content:center}
.act[data-a=feed]{background:#ffd9b8}.act[data-a=play]{background:#ffc9dc}.act[data-a=games]{background:#ddd0ff}.act[data-a=clean]{background:#c4e7ff}
.act[data-a=sleep]{background:#fff0b3}.act[data-a=heal]{background:#c9f1d6}.act[data-a=shop]{background:#ffe1ef}.act[data-a=room]{background:#ffe6c9}
.act:active:not(:disabled),.chip:active,.btn:active,.card:active:not(:disabled),.claim:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.act:disabled{filter:grayscale(.7);opacity:.5}
.dot{position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--ink);pointer-events:none}
/* sheets */
#sheetWrap{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;line-height:normal}
#sheetWrap.hidden{display:none}
.sheet{position:relative;flex:1;min-height:0;background:#fff2e4;display:flex;flex-direction:column;padding:8px 8px 6px;animation:fadein .15s ease-out}
@keyframes fadein{from{opacity:0;transform:scale(.97)}}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:6px}
#shTitle{font-size:22px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#shRight{display:flex;gap:6px;align-items:center}
.xbtn{width:36px;height:36px;font-size:22px;background:var(--cream);border:3px solid var(--ink);border-radius:11px;box-shadow:0 3px 0 var(--ink);padding:0;line-height:1}
.mini{display:flex;align-items:center;gap:5px;font-size:16.5px;padding:3px 8px;background:var(--cream);border:3px solid var(--ink);border-radius:10px}
.mini:empty{display:none}
.tabs{display:flex;gap:7px;margin-bottom:9px}
.tabs.many{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs:empty{display:none}
.tab{flex:1;min-height:42px;padding:4px 0;font-size:22px;background:#f5dcc8;border:3px solid var(--ink);border-radius:10px}
.tab.on{background:var(--lemon)}
.grid{flex:1;min-height:0;align-content:start;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;overflow-y:auto;overflow-x:hidden;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.big .cimg{height:84px}
.grid.big .card{min-height:130px}
.grid.list{grid-template-columns:1fr}
.card{height:auto;background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:196px;position:relative}
.cfoot span,.csub span{display:flex;align-items:center;gap:2px;white-space:nowrap}
.g4 .card{min-height:0;padding:5px 2px 5px;gap:2px}
.card.on{background:#d7f7e2}
.card:disabled{opacity:.55}
.card.locked{background:#eadfd6}
.cimg{height:80px;display:flex;align-items:center;justify-content:center;position:relative}
.g4 .cimg{height:40px}
.cimg .lk{position:absolute;right:-12px;bottom:-4px}
.cname{font-size:22px;line-height:1;text-align:center}
.g4 .cname{font-size:16.5px}
.csub{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;font-size:16.5px;line-height:1;min-height:13px}
.csub span{display:flex;align-items:center;gap:2px;height:18px}
.cfoot{margin-top:auto;font-size:22px;display:flex;align-items:center;gap:4px}
.cnt{position:absolute;top:5px;right:6px;font-size:16.5px;}
.pips{display:flex;gap:3px}.pips i{width:8px;height:8px;border:2px solid var(--ink);border-radius:50%;background:#fff}.pips i.f{background:#b48cf2}
.goal{display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:12px 12px;min-height:84px}
.goal.done{opacity:.55}
.goal .gt{flex:1;min-width:0;line-height:1.1}
.goal b{font-size:22px;display:block;line-height:1.1}
.goal small{font-size:16.5px;opacity:.75;display:block;margin-top:2px}
.gbar{height:12px;margin-top:6px;border:2px solid var(--ink);border-radius:4px;background:#fff;overflow:hidden;margin-top:3px}.gbar i{display:block;height:100%;background:#ffd84d}
.greward{display:flex;align-items:center;gap:4px;font-size:22px;white-space:nowrap}
.claim{background:var(--lemon);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:8px 10px;font-size:22px;display:flex;align-items:center;gap:3px}
/* modal */
#modalWrap{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}
#modalWrap.hidden{display:none}
.shade{position:absolute;inset:0;background:rgba(40,25,45,.45)}
.modal{position:relative;width:100%;max-width:340px;background:#fff2e4;border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:18px 16px 16px;text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mTitle{font-size:33px;line-height:1.1}
.mSub{font-size:16.5px;opacity:.75;margin-top:4px}
.mRows{margin:12px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.mRows div{background:var(--cream);border:2px solid var(--ink);border-radius:8px;padding:5px 8px;font-size:16.5px;line-height:1.1}
.mRows b{display:block;font-size:16.5px;opacity:.6;}
.mBtns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:10px 0;font-size:22px;background:var(--lemon);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--cream)}
.btn.warn{background:#ffc2cb}
.portrait{display:flex;justify-content:center;margin:4px 0 6px}
#nameIn{width:100%;margin-top:12px;font:inherit;font-size:22px;text-align:center;padding:8px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text;outline:none}
.reward{display:flex;align-items:center;justify-content:center;gap:8px;font-size:33px;margin-top:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.days div{border:2px solid var(--ink);border-radius:8px;background:var(--cream);padding:4px 0;font-size:16.5px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.days div.past{background:#d7f7e2}.days div.now{background:var(--lemon);transform:scale(1.1)}
.unl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.unl div{width:44px;height:44px;border:2px solid var(--ink);border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center}
@media(min-width:521px){#app{box-shadow:0 0 0 4px var(--ink),0 0 40px rgba(59,42,58,.35)}}

// achievements
const ACH=[['feed10','Snack Time','Feed 10 times',()=>S.st.fed,10,15],['feed100','Gourmet','Feed 100 times',()=>S.st.fed,100,60],['clean10','Squeaky Clean','Clean 10 times',()=>S.st.cleaned,10,15],['clean60','Neat Freak','Clean 60 times',()=>S.st.cleaned,60,50],
 ['pat30','Cuddle Bug','Pet 30 times',()=>S.st.pats,30,15],['game10','Player One','Play 10 games',()=>S.st.games,10,20],['game50','Gamer','Play 50 games',()=>S.st.games,50,50],['game200','Arcade Legend','Play 200 games',()=>S.st.games,200,120],
 ['trick1','Good Pet','Learn a trick',()=>S.st.learned,1,20],['trick8','Show Star','Learn 8 tricks',()=>S.st.learned,8,80],['evo1','Growing Up','Evolve once',()=>S.st.evos,1,15],['adult1','All Grown Up','Raise an adult',()=>S.st.adults,1,40],
 ['album6','Pet Spotter','Discover 6 pets',()=>albumCount(),6,40],['album17','Complete Album','Discover all 17 pets',()=>albumCount(),17,300],['gen3','Pet Parent','Raise 3 pets',()=>S.gen,3,60],
 ['buy10','Shopper','Buy 10 things',()=>S.st.bought,10,20],['buy60','Big Spender','Buy 60 things',()=>S.st.bought,60,80],['wear5','Fashionista','Own 5 outfits',()=>Object.keys(WEAR).filter(owns).length,5,40],['decor8','Cozy Home','Own 8 decorations',()=>Object.keys(DECOR).filter(owns).length,8,50],
 ['day3','Regular','3-day streak',()=>S.daily.best,3,20],['day7','Devoted','7-day streak',()=>S.daily.best,7,60],['lv5','Rising Star','Reach level 5',()=>level(),5,30],['lv10','Pro Carer','Reach level 10',()=>level(),10,70],['lv15','Master Carer','Reach level 15',()=>level(),15,150],
 ['catch25','Quick Paws','25 in Snack Catch',()=>S.best.catch||0,25,25],['run40','Speedster','40 in Hop Run',()=>S.best.run||0,40,25],['mel8','Maestro','8 in Melody',()=>S.best.melody||0,8,25],['mem10','Sharp Memory','Memory in 10 moves',()=>S.best.memory||0,1,25],
 ['bub40','Bubble Popper','40 in Bubble Pop',()=>S.best.bubble||0,40,25],['peek25','Peekaboo Pro','25 in Peekaboo',()=>S.best.peek||0,25,25],['guess5','Mind Reader','5/5 in Left or Right',()=>S.best.guess||0,5,30]];
const albumCount=()=>ALBUM.filter(f=>S.album[f]).length;
function claimable(){return ACH.filter(a=>!S.achDone.includes(a[0])&&a[3]()>=a[4]).length}
function openBook(tab){const tabs=[['album','Album',()=>openBook('album')],['goals','Goals',()=>openBook('goals')]];
 openSheet('Book','book',tabs,tab,body=>{
  if(tab==='album')for(const f of ALBUM){const sp=S.album[f];const c=petCanvas(f,sp||'berry',{eyes:'open',mouth:'smile'},{noWear:1,tint:sp?null:'rgba(43,29,51,1)'});const b=card(body,{icon:fitImg(cropC(c),72),name:sp?FORMS[f].name:'???',sub:'',fn:()=>{if(sp)toast(FORMS[f].name+' · '+STAGE_NAME[FORMS[f].stage])}})}
  if(tab==='goals'){const list=ACH.map(a=>{const v=a[3](),done=S.achDone.includes(a[0]);return{a,v,done,ready:!done&&v>=a[4]}}).sort((x,y)=>(y.ready-x.ready)||(x.done-y.done));
   for(const{a,v,done,ready}of list){const el=document.createElement('div');el.className='goal'+(done?' done':'');
    el.innerHTML=`${pximg('trophy',4)}<div class="gt"><b>${a[1]}</b><small>${a[2]}</small><div class="gbar"><i style="width:${Math.min(100,v/a[4]*100)}%"></i></div></div>`+(ready?`<button class="claim">${pximg('coin',3)}${a[5]}</button>`:`<div class="greward">${done?'✓':pximg('coin',3)+a[5]}</div>`);
    if(ready)el.querySelector('.claim').onclick=()=>{S.achDone.push(a[0]);S.coins+=a[5];addXP(10);SND.play('buy');burst('spark',64,40,8,24);save();refreshUI();sheetFn()};body.appendChild(el)}}},
 {cls:tab==='album'?'big':'list',right:tab==='album'?`${albumCount()}/${ALBUM.length}`:`${S.achDone.length}/${ACH.length}`})}

// modals
function modalOpen(){return!$('#modalWrap').classList.contains('hidden')}
function modal(html,btns){$('#modal').innerHTML=html+`<div class="mBtns">${btns.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
 $('#modal').querySelectorAll('.btn').forEach(el=>el.onclick=()=>{SND.play('tap');btns[+el.dataset.i].fn()});$('#modalWrap').classList.remove('hidden')}
function closeModal(){$('#modalWrap').classList.add('hidden');setTimeout(maybePopups,300)}
function checkName(){if(hasPet()&&!S.name&&!game){const def=pick(NAMES);modal(`<div class="portrait">${petPortrait(S.form,S.species,{eyes:'happy',mouth:'big'},4)}</div><input id="nameIn" maxlength="10" value="${def}" autocomplete="off">`,
 [{label:'OK',fn:()=>{const v=($('#nameIn').value||'').trim().slice(0,10)||def;S.name=v;save(true);closeModal();refreshUI();SND.play('happy');burst('heart',pet.x,pet.top,4,14)}}]);setTimeout(()=>{const i=$('#nameIn');if(i){i.focus();i.select()}},50)}}
function openInfo(){if(!hasPet()&&S.stage!=='dead')return;const F=FORMS[S.form];
 const rows=[['Form',F.name],['Stage',STAGE_NAME[F.stage]],['Age',ageStr(Date.now()-S.bornAt)],['Weight',Math.round(S.weight)+'g'],['Tricks',learnedCount()+'/8'],['Gen',S.gen]];
 const draw=()=>modal(`<div class="portrait">${petPortrait(S.form,S.species,S.stage==='dead'?{eyes:'x',mouth:'flat'}:S.asleep?{eyes:'closed',mouth:'o'}:{eyes:'open',mouth:'smile'},4)}</div><div class="mTitle">${S.name||'???'}</div><div class="mRows">${rows.map(r=>`<div><b>${r[0]}</b>${r[1]}</div>`).join('')}</div>`,
  [{label:'Bye',cls:'warn',fn:()=>modal(`<div class="portrait">${petPortrait(S.form,S.species,{eyes:'sad',mouth:'frown',tear:true},4)}</div><div class="mTitle">${S.name}?</div>`,[{label:'No',cls:'alt',fn:draw},{label:'Bye',cls:'warn',fn:()=>{closeModal();newGeneration()}}])},{label:'OK',fn:closeModal}]);draw()}
function showDeath(){modal(`<div class="portrait">${petPortrait(S.form,S.species,{eyes:'closed',mouth:'smile'},4)}</div><div class="mTitle">${S.name||'???'}</div><div class="mSub">${FORMS[S.form].name} · ${ageStr((S.last||Date.now())-S.bornAt)}</div>`,[{label:'New egg',fn:()=>{closeModal();newGeneration()}}])}
function newGeneration(){S=freshState(S);act=null;events=[];parts.length=0;bgKey='';pet.x=64;pet.y=GROUND;pet.mode='idle';save(true);refreshUI()}
function dateKey(t){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function showDaily(){const today=dateKey(Date.now()),yest=dateKey(Date.now()-864e5);const streak=S.daily.last===yest?S.daily.streak+1:1;const idx=(streak-1)%7,amt=DAILY[idx];
 modal(`<div class="portrait">${pximg('gift',5)}</div><div class="mTitle">Day ${streak}</div><div class="days">${DAILY.map((v,i)=>`<div class="${i<idx?'past':i===idx?'now':''}">${pximg('coin',2)}${v}</div>`).join('')}</div>`,
  [{label:`+${amt}`,fn:()=>{S.daily={last:today,streak,best:Math.max(S.daily.best||0,streak)};S.coins+=amt;addXP(10);SND.play('buy');save(true);refreshUI();closeModal()}}])}
function unlocksAt(L){const r=[];const add=(id,ic)=>r.push(ic);for(const id in FOOD)if(FOOD[id].lv===L)add(id,pximg(id,3));for(const id in CARE)if(CARE[id].lv===L)add(id,pximg(CARE[id].icon,3));for(const id in TOYS)if(TOYS[id].lv===L)add(id,pximg(TOYS[id].icon,3));for(const id in WEAR)if(WEAR[id].lv===L)add(id,pximg('w_'+id,3));
 for(const id in DECOR)if(DECOR[id].lv===L)add(id,fitImg(decorIcon(id),34));for(const id in WALLS)if(WALLS[id].lv===L)add(id,canvImg(swatch('wall',id),2));for(const id in FLOORS)if(FLOORS[id].lv===L)add(id,canvImg(swatch('floor',id),2));
 for(const sp in SPECIES)if(SPECIES[sp].lv===L&&L>1)add(sp,canvImg(petCanvas('egg',sp,null),1));return r}
function showLevel(L){SND.play('level');const u=unlocksAt(L);modal(`<div class="mTitle">Level ${L}</div><div class="reward">${pximg('coin',4)}+${L*10}</div>${u.length?`<div class="unl">${u.map(h=>`<div>${h}</div>`).join('')}</div>`:''}`,[{label:'OK',fn:closeModal}])}
function maybePopups(){if(modalOpen()||game||act||(S.stage!=='select'&&!hasPet()&&S.stage!=='egg'))return;if(pendingLevels.length){showLevel(pendingLevels.shift());return}if(S.daily.last!==dateKey(Date.now())&&S.stage!=='select'){showDaily();return}}

// ================= input =================
function toLogical(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
let pdown=false;
cv.addEventListener('pointerdown',e=>{e.preventDefault();SND.init();pdown=true;const[x,y]=toLogical(e);
 if(game){if(game.tap)game.tap(x,y);return}
 if(S.stage==='select'){let best=-1,bd=1e9;SP_ORDER.forEach((sp,i)=>{const[ex,ey]=eggSlot(i);const d=Math.hypot(x-ex,y-(ey-9));if(d<bd){bd=d;best=i}});if(bd<14)chooseEgg(SP_ORDER[best]);return}
 if(S.stage==='egg'&&!act){if(Math.abs(x-pet.x)<10){SND.play('tap');burst('heart',pet.x,GROUND-20,1,8)}return}
 if(S.stage==='dead'&&!act){showDeath();return}
 if(hasPet()&&!act&&Math.abs(x-pet.x)<pet.hw+2&&y>pet.top-4&&y<pet.y+2)doPat()});
cv.addEventListener('pointermove',e=>{if(game&&game.move&&(pdown||e.pointerType==='mouse')){const[x,y]=toLogical(e);game.move(x,y)}});
window.addEventListener('pointerup',()=>pdown=false);
window.addEventListener('keydown',e=>{if(!game)return;if((e.code==='Space'||e.code==='ArrowUp')&&game.id==='run')game.tap(0,0);if(game.id==='catch'){if(e.code==='ArrowLeft')game.tx=clamp(game.tx-14,12,116);if(e.code==='ArrowRight')game.tx=clamp(game.tx+14,12,116)}});

// ================= layout & loop =================
function fit(){const app=$('#app'),cs=getComputedStyle(app);const aw=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-28,ah=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-$('header').offsetHeight-$('nav').offsetHeight-30;const dpr=window.devicePixelRatio||1;const raw=Math.min(aw/W,ah/H);let s=raw;cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
new ResizeObserver(fit).observe($('#app'));window.addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick();else save(true)});
window.addEventListener('pagehide',()=>save(true));
catchUp();buildBG();refreshUI();fit();
setInterval(tick,1000);setInterval(()=>save(),10000);
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
if(hasPet()&&!S.name)setTimeout(checkName,600);
else if(S.stage==='dead')setTimeout(showDeath,600);
else setTimeout(maybePopups,800);
initCloud();
</script>
</body>
</html>
